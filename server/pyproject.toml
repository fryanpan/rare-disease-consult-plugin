[project]
name = "rare-disease-consult-server"
version = "0.1.0"
description = "HPO/Orphanet MCP server for the rare-disease-consult Claude Code plugin"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30.0,<2",
    "pyhpo>=4.0.0",
    "certifi>=2024.2.2",
]

[tool.uv]
# mcp requires pyjwt[crypto], which pulls in cryptography. Only mcp's OAuth
# client code imports jwt, and this stdio server never loads it. Dropping the
# extra removes cryptography, whose patched releases (49+) ship no Intel macOS
# wheel.
override-dependencies = ["pyjwt>=2.15.0"]
